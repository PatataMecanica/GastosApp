<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gastos S&amp;A</title>
  <meta name="description" content="Gastos compartidos">
  <meta name="theme-color" content="#F6F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1D1B1A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gastos S&amp;A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Chakra+Petch:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Pone el modo y el estilo guardados antes de pintar, para que no parpadee. La lógica completa está en applyDesign (app.js). -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('gastos_sa') || '{}'), h = document.documentElement;
      h.dataset.style = s.estilo === 'neon' || s.estilo === 'retro' ? s.estilo : 'pastel';
      h.dataset.theme = s.tema === 'light' || s.tema === 'dark' ? s.tema : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="page">
    <header id="top" class="head"></header>
    <main id="view"></main>
  </div>

  <nav id="nav" hidden>
    <button data-tab="inicio" aria-label="Inicio">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </button>
    <button data-tab="gastos" aria-label="Adelantos">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      <span>Adelantos</span>
    </button>
    <button id="fab" aria-label="Añadir adelanto">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button data-tab="analisis" aria-label="Análisis">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Análisis</span>
    </button>
    <button data-tab="ajustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <div class="sheet-grab" aria-hidden="true"></div>
      <div class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
